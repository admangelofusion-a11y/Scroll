<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Animação de scroll</title>
  <meta name="description" content="Sequência de frames controlada pela rolagem da página.">
  <meta name="color-scheme" content="dark">
  <link rel="stylesheet" href="styles.css">
  <!-- Começa a baixar o primeiro frame antes do script rodar -->
  <link rel="preload" as="image" href="frames/frame-0001.webp" type="image/webp">
</head>
<body>
  <!-- Tela de carregamento (some quando os frames terminam de carregar) -->
  <div class="loader" id="loader" role="status" aria-live="polite">
    <p class="loader__text" id="loader-text">Carregando 0%</p>
    <div class="loader__bar" aria-hidden="true"><span id="loader-fill"></span></div>
  </div>

  <!-- Seção alta: o espaço extra de rolagem controla a animação -->
  <section class="scrub" id="scrub" aria-label="Animação controlada pela rolagem">
    <div class="stage" id="stage">
      <canvas id="canvas" role="img" aria-label="Sequência animada"></canvas>

      <noscript>
        <img class="stage__fallback" src="frames/frame-0001.webp" alt="">
      </noscript>

      <div class="overlay">
        <h1 class="overlay__title">Role para animar</h1>
        <p class="overlay__hint">Continue descendo a página</p>
      </div>

      <div class="progress" aria-hidden="true"><span></span></div>
    </div>
  </section>

  <!-- Conteúdo normal do site, depois da animação -->
  <main class="content">
    <h2>Depois da animação</h2>
    <p>Aqui começa o resto da página. Substitua este bloco pelo conteúdo do seu site.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
